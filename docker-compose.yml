services:
  db:
    image: mysql:8.0
    container_name: cep_mysql
    restart: unless-stopped
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-cep_db}
      MYSQL_USER: ${MYSQL_USER:-cep_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-cep_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-cep_root_password}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD:-cep_root_password}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cep_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql+asyncmy://${MYSQL_USER:-cep_user}:${MYSQL_PASSWORD:-cep_password}@db:3306/${MYSQL_DATABASE:-cep_db}
      SECRET_KEY: ${SECRET_KEY:-change_this_secret_key_in_production_super_safe_random_key_12345}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  mysql_data:
    name: cep_mysql_data
